[project]
name = "vibe-check-core"
version = "0.0.0"
description = "Shared profile domain logic for vibe-check"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.26.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibe_check_core"]
