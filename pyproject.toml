[project]
name = "vibe-check-workspace"
version = "0.0.0"
description = "vibe-check monorepo — transparent user preference profiles"
requires-python = ">=3.12"
dependencies = [
    "vibe-check-mcp",
]

[tool.uv.sources]
vibe-check-mcp = { workspace = true }
vibe-check-core = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/core",
    "apps/mcp",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/mcp/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
