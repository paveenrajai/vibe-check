[project]
name = "vibe-check-mcp"
version = "0.0.0"
description = "MCP server for vibe-check user preference profiles"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=2.3,<3",
    "uvicorn>=0.32.0",
    "vibe-check-core",
]

[project.scripts]
vibe-check = "vibe_check_mcp.__main__:main"

[tool.uv.sources]
vibe-check-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibe_check_mcp"]

